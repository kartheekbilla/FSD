<!DOCTYPE html>
<html lang="en">
<head>
<title>Input and Output Methods Demo</title>
<style>
  body {font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 10px;}
  section {margin-bottom: 30px;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;}
  h2 {text-align: center;
    color: #2a4d69;}
  button {margin-top: 10px;
    padding: 6px 12px;}
  p.output {margin-top: 10px;
    font-style: italic;
    color: #555;}
</style></head>
<body>
<h2>Different Ways to Take Input and Display Output</h2>
<section>
  <h3>1. Text Input + Button</h3>
  <input id="textInput" type="text" placeholder="Enter your name">
  <button onclick="showTextInput()">Submit</button>
  <p id="textOutput" class="output"></p>
</section>
<section>
  <h3>2. Prompt Box</h3>
  <button onclick="showPrompt()">Click to enter name</button>
  <p id="promptOutput" class="output"></p>
</section>
<section>
  <h3>3. Textarea Input</h3>
  <textarea id="textareaInput" rows="4" cols="40" placeholder="Write something..."></textarea><br>
  <button onclick="showTextarea()">Display Text</button>
  <p id="textareaOutput" class="output"></p>
</section>
<script>
  function showTextInput() {
    const input = document.getElementById('textInput').value.trim();
    const output = input ? `Hello, ${input}! Thanks for submitting your name.` : "Please enter your name above.";
    document.getElementById('textOutput').innerText = output;
  }
  function showPrompt() {
    const name = prompt("Please enter your name:");
    const output = name ? `Welcome, ${name}!` : "No name entered.";
    document.getElementById('promptOutput').innerText = output;
  }
  function showTextarea() {
    const text = document.getElementById('textareaInput').value.trim();
    const output = text ? `You wrote: ${text}` : "Please write something in the textarea.";
    document.getElementById('textareaOutput').innerText = output;
  }
</script></body>
</html>
