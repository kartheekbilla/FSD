<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
  <title>Compare Three Integers</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;}
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;}
  </style>
</head>
<body>
<h2>Enter and Compare Three Numbers</h2>
<button onclick="compareNumbers()">Check Larger Number</button>
<script>
  function compareNumbers() {
    const input = prompt("Enter three integers separated by commas (e.g., 5,10,15):");
    if (!input) {alert("Input cannot be empty!");return;}
    const numbers = input.split(',').map(num => parseInt(num.trim()));
    if (numbers.length !== 3 || numbers.some(isNaN)) {
      alert("Please enter exactly three valid integers separated by commas.");return;}
    const [num1, num2, num3] = numbers;
    if (num1 === num2 && num2 === num3) {
      alert("EQUAL NUMBERS");} 
      else {
      const largest = Math.max(num1, num2, num3);
      alert(`${largest} - LARGER NUMBER`);}}
</script>
</body>
</html>
