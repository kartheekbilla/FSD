<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
  <title>Weekdays with Switch Case</title>
  <style>
    body {font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;}
    button {padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;}
  </style>
</head>
<body>
<h2>Display Weekday</h2>
<button onclick="showWeekday()">Check Weekday</button>
<script>
  function showWeekday() {
    const dayNumber = parseInt(prompt("Enter a number (1-7) to get the weekday:"));
    let message;
    switch (dayNumber) {
      case 1: message = "Sunday";break;
      case 2: message = "Monday";break;
      case 3: message = "Tuesday";break;
      case 4: message = "Wednesday";break;
      case 5: message = "Thursday";break;
      case 6: message = "Friday";break;
      case 7: message = "Saturday";break;
      default:
        message = "Invalid input! Please enter a number between 1 and 7.";
    }
    alert(message);
}
</script></body>
</html>
