<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Object All-in-One Demo</title>
  <style>
    body {font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f0f8ff;
      color: #333;}
    h2 {color: darkgreen;}
    ul {font-size: 18px;}
  </style>
</head>
<body>
<h2>JavaScript Math Object - Properties and Methods</h2>
<ul id="mathResults"></ul>
<script>
  const output = document.getElementById("mathResults");
  const results = [`Math.PI = ${Math.PI}`,
    `Math.E = ${Math.E}`,
    `Math.SQRT2 = ${Math.SQRT2}`,
    `Random number (0–1) = ${Math.random().toFixed(4)}`,
    `Power: 3^4 = ${Math.pow(3, 4)}`,
    `Square root of 64 = ${Math.sqrt(64)}`,
    `Round 4.6 = ${Math.round(4.6)}`,
    `Floor 4.9 = ${Math.floor(4.9)}`,
    `Min of (3, 7, 2, 10) = ${Math.min(3, 7, 2, 10)}`,
    `Max of (3, 7, 2, 10) = ${Math.max(3, 7, 2, 10)}`,];
  results.forEach(result => {
    const li = document.createElement("li");
    li.textContent = result;
    output.appendChild(li);});
</script>
</body>
</html>
