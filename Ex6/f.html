<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
  <title>Date Object Demo</title>
  <style>
    body {font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f8f8f8;
      color: #333;}
    h2 {color: darkblue;}
    ul {font-size: 18px;
      line-height: 1.6;}
  </style></head>
<body>
<h2>JavaScript Date Object - Properties and Methods</h2>
<ul id="dateOutput"></ul>
<script>const output = document.getElementById("dateOutput");
  const now = new Date();
  const dateInfo = [`Full Date & Time: ${now}`,
    `Date String: ${now.toDateString()}`,
    `Time String: ${now.toTimeString()}`,
    `Locale String: ${now.toLocaleString()}`,
    `Year: ${now.getFullYear()}`,
    `Month (0-11): ${now.getMonth()} (Actual: ${now.getMonth() + 1})`,
    `Date (Day of the Month): ${now.getDate()}`,
    `Day (0-Sun to 6-Sat): ${now.getDay()}`,
    `Hours: ${now.getHours()}`,
    `Minutes: ${now.getMinutes()}`,
    `Seconds: ${now.getSeconds()}`,
    `Milliseconds: ${now.getMilliseconds()}`,
    `Timestamp (ms since Jan 1, 1970): ${now.getTime()}`,
    `ISO Format: ${now.toISOString()}`,
    `UTC String: ${now.toUTCString()}`];
  dateInfo.forEach(info => {
    const li = document.createElement("li");
    li.textContent = info;
    output.appendChild(li);});
</script></body>
</html>
