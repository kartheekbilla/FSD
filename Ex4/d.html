<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Styling Showcase</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }
    .heading {
      font-size: 40px;
      font-weight: bold;
      font-style: italic;
      text-decoration: overline underline;
      text-align: left;
      text-transform: uppercase;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .paragraph {
      font-size: 20px;
      font-weight: 500;
      font-style: oblique;
      text-decoration: none;
      text-align: justify;
      text-transform: none;
      color: #555;
      width: 80%;
    }
  </style>
</head>
<body>
  <h1 class="heading">Creative Text Styling</h1>
  <p class="paragraph">
    This sample paragraph illustrates various text styling capabilities of CSS including font effects, alignment, and color schemes. You can use these techniques to enhance readability and visual appeal in your web pages.
  </p>
</body>
</html>
