<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Color Formats</title>
  <style>
    .named {
      color: white;
      background-color: teal;
      padding: 10px;
    }
    .hex {
      color: white;
      background-color: #ff5733;
      padding: 10px;
    }
    .rgb {
      color: white;
      background-color: rgb(60, 179, 113);
      padding: 10px;
    }
    .rgba {
      color: black;
      background-color: rgba(255, 99, 71, 0.5);
      padding: 10px;
    }
    .hsl {
      color: white;
      background-color: hsl(240, 100%, 50%);
      padding: 10px;
    }
    .hsla {
      color: black;
      background-color: hsla(120, 100%, 75%, 0.3); 
      padding: 10px;
    }
  </style>
</head>
<body>
  <h2>Color Reference Formats in CSS</h2>
  <p class="named">This uses a <strong>named color</strong>.</p>
  <p class="hex">This uses a <strong>hexadecimal color</strong>.</p>
  <p class="rgb">This uses an <strong>RGB color</strong>.</p>
  <p class="rgba">This uses an <strong>RGBA color</strong>.</p>
  <p class="hsl">This uses an <strong>HSL color</strong>.</p>
  <p class="hsla">This uses an <strong>HSLA color</strong>.</p>
</body>
</html>
