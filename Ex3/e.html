<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Selectors Showcase</title>
  <style>
    a:hover {
      color: darkorange;
    }
    input:focus {
      border: 2px solid royalblue;
    }
    p:first-child {
      text-decoration: underline;
    }
    p::before {
      content: "💡 Tip: ";
      font-weight: bold;
    }
    p::after {
      content: " ✅";
      font-style: italic;
    }
    p::first-letter {
      font-size: 150%;
      color: teal;
    }
    [title] {
      color: purple;
    }
    [type="email"] {
      background-color: #ffe;
    }
    [class~="featured"] {
      border: 2px dashed coral;
      padding: 10px;
    }
    [lang|="fr"] {
      color: darkgreen;
    }
    [href^="mailto"] {
      color: maroon;
    }
    [href$=".docx"] {
      font-style: italic;
    }
    [data-category*="tech"] {
      background-color: #f0f8ff;
    }
  </style>
</head>
<body>
  <h2>Useful Links</h2>
  <a href="mailto:info@example.com" title="Contact Us">Send us an email</a>
  <a href="resume.docx" title="Download CV">Download Resume</a>
  <h2>Form Inputs</h2>
  <label for="email">Your Email:</label>
  <input type="email" id="email" placeholder="example@domain.com">

  <h2>Content Highlights</h2>
  <div class="notice featured">Breaking: New tech release coming soon!</div>
  <p data-category="tech-news">AI is transforming the future of industries.</p>
</body>
</html>
